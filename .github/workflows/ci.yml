name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Exécute exactement la même chaîne qu'en local (npm run check) : ce qui casse la CI
      # est strictement ce qui casse pour un développeur sur sa machine, rien de plus.
      - name: Run full check (format, lint, types, unit, a11y, lighthouse)
        # SITE_URL n'est pas un secret (c'est l'URL publique du site) : placeholder explicite
        # tant que le vrai domaine de production n'est pas tranché, cohérent avec .env.example.
        env:
          SITE_URL: http://localhost:4321
        run: npm run check

      - name: Print Lighthouse scores
        if: always()
        run: node .github/scripts/print-lighthouse-scores.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
